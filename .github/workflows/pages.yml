name: Deploy Hugo Pages Clean

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install D2 CLI
        run: |
          set -euo pipefail
          D2_VERSION="v0.6.9"
          ARCHIVE="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/${ARCHIVE}"
          mkdir -p "${RUNNER_TEMP}/d2-install"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" \
            -C "${RUNNER_TEMP}/d2-install"
          sudo install -m 755 \
            "${RUNNER_TEMP}/d2-install/d2-${D2_VERSION}/bin/d2" \
            /usr/local/bin/d2
          d2 --version

      - name: Generate D2 SVG diagrams
        run: python3 scripts/build_d2.py

      - name: Install Typst CLI
        run: |
          set -euo pipefail
          TYPST_VERSION="v0.15.0"
          ARCHIVE="typst-x86_64-unknown-linux-musl.tar.xz"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/${ARCHIVE}"
          mkdir -p "${RUNNER_TEMP}/typst-install"
          tar -xJf "${RUNNER_TEMP}/${ARCHIVE}" \
            -C "${RUNNER_TEMP}/typst-install"
          sudo install -m 755 \
            "${RUNNER_TEMP}/typst-install/typst-x86_64-unknown-linux-musl/typst" \
            /usr/local/bin/typst
          typst --version

      - name: Generate Typst SVG diagrams
        run: python3 scripts/build_typst.py

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
