<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orioninsist | Links</title>
  <meta name="description" content="Official orioninsist links: website, GitHub, PromptBase, writing, products, video, support, and social profiles.">
  <meta name="author" content="Murat Kurkoglu">
  <link rel="canonical" href="https://orioninsist.org/contact/">
  <link rel="icon" href="/contact/images/orioninsist.avif">

  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://orioninsist.org/contact/">
  <meta property="og:title" content="orioninsist | Links">
  <meta property="og:description" content="Official links for orioninsist.">
  <meta property="og:image" content="https://orioninsist.org/contact/images/orioninsist.avif">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/brands.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0f;
      --surface: #15171c;
      --surface-hover: #1c1f25;
      --border: #2a2e36;
      --text: #f5f7fa;
      --muted: #9da4af;
      --max: 620px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(calc(100% - 28px), var(--max));
      margin: 0 auto;
      padding: 34px 0 30px;
    }

    .profile {
      text-align: center;
      margin-bottom: 26px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .profile h1 {
      margin: 15px 0 0;
      font-size: 1.55rem;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .handle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .bio {
      max-width: 500px;
      margin: 11px auto 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      position: relative;
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      min-height: 60px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
      transition: background 150ms ease, transform 150ms ease, border-color 150ms ease;
    }

    .link:hover,
    .link:focus-visible {
      background: var(--surface-hover);
      border-color: #404650;
      transform: translateY(-1px);
      outline: none;
    }

    .link img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      justify-self: center;
    }

    .link-label {
      text-align: center;
      padding: 0 8px;
    }

    .link-arrow {
      justify-self: center;
      color: var(--muted);
      font-size: 1rem;
    }

    .promptbase-mark {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      justify-self: center;
      border-radius: 7px;
      background: #f5f7fa;
      color: #0b0c0f;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 22px;
    }

    .socials a {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      transition: background 150ms ease, transform 150ms ease;
    }

    .socials a:hover,
    .socials a:focus-visible {
      background: var(--surface-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .socials img {
      width: 20px;
      height: 20px;
    }

    .copy-link {
      display: block;
      margin: 18px auto 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 420px) {
      .page { width: min(calc(100% - 22px), var(--max)); padding-top: 26px; }
      .avatar { width: 82px; height: 82px; }
      .link { min-height: 58px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="profile">
      <img class="avatar" src="/contact/images/orioninsist.avif" srcset="/contact/images/orioninsist-2.avif 2x" alt="orioninsist profile image" fetchpriority="high" decoding="async">
      <h1>orioninsist</h1>
      <p class="handle">@orioninsist</p>
      <p class="bio">Cybersecurity, Linux, software, writing, digital products, and independent projects.</p>
    </header>

    <nav class="links" aria-label="Main links">
      <a class="link" href="https://orioninsist.org/" target="_blank" rel="noopener noreferrer" data-track="Website">
        <img src="images/icons/generic-homepage.svg" alt="" aria-hidden="true">
        <span class="link-label">Website</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://github.com/orioninsist" target="_blank" rel="noopener noreferrer" data-track="GitHub">
        <img src="images/icons/github.svg" alt="" aria-hidden="true">
        <span class="link-label">GitHub</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://promptbase.com/profile/orioninsist" target="_blank" rel="noopener noreferrer" data-track="PromptBase">
        <span class="promptbase-mark" aria-hidden="true">PB</span>
        <span class="link-label">PromptBase</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://medium.com/@orioninsist" target="_blank" rel="noopener noreferrer" data-track="Medium">
        <img src="images/icons/medium.svg" alt="" aria-hidden="true">
        <span class="link-label">Medium</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://www.etsy.com/shop/orioninsist" target="_blank" rel="noopener noreferrer" data-track="Etsy">
        <img src="images/icons/etsy.svg" alt="" aria-hidden="true">
        <span class="link-label">Etsy</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://www.youtube.com/@orioninsist-official" target="_blank" rel="noopener noreferrer" data-track="YouTube">
        <img src="images/icons/youtube.svg" alt="" aria-hidden="true">
        <span class="link-label">YouTube</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://buymeacoffee.com/orioninsist" target="_blank" rel="noopener noreferrer" data-track="Support">
        <img src="images/icons/buy-me-a-coffee.svg" alt="" aria-hidden="true">
        <span class="link-label">Support</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="mailto:muratkurkoglu@gmail.com" data-track="Email">
        <img src="images/icons/email.svg" alt="" aria-hidden="true">
        <span class="link-label">Email</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <nav class="socials" aria-label="Social profiles">
      <a href="https://x.com/InsistOrion" target="_blank" rel="noopener noreferrer" data-track="X" aria-label="X"><img src="images/icons/x.svg" alt="" aria-hidden="true"></a>
      <a href="https://www.instagram.com/insistorion/" target="_blank" rel="noopener noreferrer" data-track="Instagram" aria-label="Instagram"><img src="images/icons/instagram.svg" alt="" aria-hidden="true"></a>
      <a href="https://www.linkedin.com/company/orioninsist/" target="_blank" rel="noopener noreferrer" data-track="LinkedIn" aria-label="LinkedIn"><img src="images/icons/linkedin.svg" alt="" aria-hidden="true"></a>
      <a href="https://www.pinterest.com/orioninsist/" target="_blank" rel="noopener noreferrer" data-track="Pinterest" aria-label="Pinterest"><img src="images/icons/pinterest.svg" alt="" aria-hidden="true"></a>
      <a href="https://www.tiktok.com/@orioninsist" target="_blank" rel="noopener noreferrer" data-track="TikTok" aria-label="TikTok"><img src="images/icons/tiktok.svg" alt="" aria-hidden="true"></a>
      <a href="https://www.facebook.com/insistorion/" target="_blank" rel="noopener noreferrer" data-track="Facebook" aria-label="Facebook"><img src="images/icons/facebook.svg" alt="" aria-hidden="true"></a>
      <a href="https://substack.com/@orioninsist" target="_blank" rel="noopener noreferrer" data-track="Substack" aria-label="Substack"><img src="images/icons/substack.svg" alt="" aria-hidden="true"></a>
      <a href="https://dev.to/orioninsist" target="_blank" rel="noopener noreferrer" data-track="Dev.to" aria-label="Dev.to"><img src="images/icons/dev-to.svg" alt="" aria-hidden="true"></a>
      <a href="https://open.spotify.com/show/2U1u9mOfxjRYf7js8Wlhwj?si=bte96u79RVyRRUcQHNFr0A" target="_blank" rel="noopener noreferrer" data-track="Spotify" aria-label="Spotify"><img src="images/icons/spotify.svg" alt="" aria-hidden="true"></a>
    </nav>

    <button class="copy-link" type="button" data-copy="https://orioninsist.org/contact/">Copy page link</button>

    <footer>
      <a href="/privacy-policy/">Privacy Policy</a>
      <span>orioninsist.org</span>
    </footer>
  </main>

  <script>
    document.querySelectorAll('[data-track]').forEach((item) => {
      item.addEventListener('click', () => {
        if (typeof gtag === 'function') {
          gtag('event', 'link_click', {
            link_name: item.dataset.track,
            link_url: item.href || ''
          });
        }
      });
    });

    const copyButton = document.querySelector('[data-copy]');
    copyButton?.addEventListener('click', async () => {
      const original = copyButton.textContent;
      try {
        await navigator.clipboard.writeText(copyButton.dataset.copy);
        copyButton.textContent = 'Copied';
        setTimeout(() => { copyButton.textContent = original; }, 1400);
      } catch {
        window.prompt('Copy this link:', copyButton.dataset.copy);
      }
    });
  </script>
</body>
</html>
