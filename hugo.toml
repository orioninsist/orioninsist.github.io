baseURL = "https://orioninsist.org/"
title = "orioninsist"
defaultContentLanguage = "en"
locale = "en-US"
enableRobotsTXT = true
enableInlineShortcodes = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableGitInfo = true

[frontmatter]
  date = ["date", "publishDate", "pubdate", ":default"]
  publishDate = ["publishDate", "pubdate", "date", ":default"]
  lastmod = [":git", "lastmod", "date", "publishDate", ":default"]
  expiryDate = ["expiryDate", "unpublishdate", ":default"]

[permalinks]
  blog = "/blog/:slug/"
  categories = "/categories/:slug/"
  tags = "/tags/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[server]
  trailingSlash = "always"

[pagination]
  pagerSize = 6

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    direction = "ltr"
    weight = 1

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "Archive"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[[menu.main]]
  identifier = "contact"
  name = "Contact"
  url = "/contact/"
  weight = 50

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 60

[params]
  description = "Orioninsist is the independent technology site of Murat Kurkoglu, covering cybersecurity, Linux, software development, system administration, automation, and practical technical workflows."
  images = ["/orioninsist-logo.png"]
  ogImage = "/orioninsist-logo.png"
  defaultTheme = "dark"
  DateFormat = "January 2, 2006"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  showToc = true
  TocOpen = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  comments = false
  hideMeta = false
  hideDescriptionInList = false
  privacyPolicy = "/privacy-policy/"

  [params.label]
    text = "orioninsist"

  [params.search]
    enable = true

  [params.buyMeACoffee]
    enabled = true
    showOnHomeOnly = true
    mode = "button"

    [params.buyMeACoffee.button]
      slug = "orioninsist"
      color = "#FFDD00"
      emoji = "☕"
      font = "Cookie"
      text = "Buy me a coffee"
      outlineColor = "#000000"
      fontColor = "#000000"
      coffeeColor = "#ffffff"

    [params.buyMeACoffee.widget]
      id = "orioninsist"
      description = "Support Orioninsist on Buy Me a Coffee."
      message = ""
      color = "#FF813F"
      position = "Right"
      xMargin = "18"
      yMargin = "18"

  [params.homeInfoParams]
    enabled = false

  [params.profileMode]
    enabled = true
    title = "Murat Kurkoglu"
    subtitle = "Founder of Orioninsist. Computer engineer writing about cybersecurity, Linux, software development, system administration, and practical technology."
    imageUrl = "images/home/murat-kurkoglu-profile-400x400.png"
    imageTitle = "Murat Kurkoglu, founder of Orioninsist"
    imageWidth = 220
    imageHeight = 220

  [params.assets]
    favicon = "/orioninsist.ico"
    schema = true

  [params.author]
    name = "Murat Kurkoglu"

  [params.cover]
    hiddenInList = false
    hiddenInSingle = false

  [params.ads]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/orioninsist"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/company/orioninsist/"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@lukas_und_mia"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/orioninsist/"
  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/orioninsist"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/oorioninsist/"
  [[params.socialIcons]]
    name = "medium"
    url = "https://medium.com/@orioninsist"
  [[params.socialIcons]]
    name = "buymeacoffee"
    url = "https://buymeacoffee.com/orioninsist"
  [[params.socialIcons]]
    name = "rss"
    url = "https://orioninsist.org/index.xml"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = false
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = false
    enableDNT = true
  [privacy.vimeo]
    disable = true
  [privacy.youTube]
    disable = false
    privacyEnhanced = true

[sitemap]
  filename = "sitemap.xml"

[minify]
  disableXML = false
  minifyOutput = true
  disableCSS = false
  disableJS = false

  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
      keepWhitespace = false
    [minify.tdewolff.json]
      keepWhitespace = false
    [minify.tdewolff.svg]
      precision = 1

[[build.cachebusters]]
  source = "assets/js/.*"
  target = "js"

[[build.cachebusters]]
  source = "assets/css/.*"
  target = "css"

[imaging]
  quality = 75
  resampleFilter = "Lanczos"

[services]
  [services.googleAnalytics]
    id = "G-6CE6YFM36C"
  [services.rss]
    limit = 50
