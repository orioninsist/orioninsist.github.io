{{- $isProduction := hugo.IsProduction | or (eq site.Params.env "production") -}}
{{- $id := site.Config.Services.GoogleAnalytics.ID -}}
{{- if $isProduction -}}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Advanced Consent Mode: keep measurement available by default outside
  // regions where consent is required. Google CMP can update these states
  // after the visitor makes a choice in EEA/UK/Switzerland.
  gtag('consent', 'default', {
    'ad_storage': 'granted',
    'analytics_storage': 'granted',
    'ad_user_data': 'granted',
    'ad_personalization': 'granted'
  });

  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'wait_for_update': 500
  }, {
    'region': [
      'AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT',
      'LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','CH','GB'
    ]
  });

  gtag('js', new Date());
  {{- with $id }}
  gtag('config', '{{ . }}', { anonymize_ip: true });
  {{- end }}
</script>

{{- with $id }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
{{- end }}

<script async src="https://fundingchoicesmessages.google.com/i/pub-2352285531358848?ers=1"></script>
<script async crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2352285531358848"></script>
{{- end -}}
