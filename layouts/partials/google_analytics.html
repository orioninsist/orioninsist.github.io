{{- $isProduction := hugo.IsProduction | or (eq site.Params.env "production") -}}
{{- $id := site.Config.Services.GoogleAnalytics.ID -}}
{{- if $isProduction -}}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'wait_for_update': 500
  });
  gtag('js', new Date());
  {{- with $id }}
  gtag('config', '{{ . }}', { anonymize_ip: true });
  {{- end }}
</script>

{{- with $id }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
{{- end }}

<script async src="https://fundingchoicesmessages.google.com/i/pub-2352285531358848?ers=1"></script>
<script async crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2352285531358848"></script>
{{- end -}}
